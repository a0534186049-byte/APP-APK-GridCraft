name: GridCraft Android APK
# Re-run release validation after the signing secrets were updated.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/prepare-gridcraft-android.py'
      - 'HEBREW_STATUS.md'
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build a test APK or a distributable signed Release
        required: true
        type: choice
        default: release
        options:
          - debug
          - release
      source_version:
        description: Kept for traceability; GridCraft uses the pinned Hebrew source commit
        required: true
        type: choice
        default: stable
        options:
          - stable
          - main

permissions:
  contents: write

jobs:
  build:
    uses: a0534186049-byte/ArtCraft-Android-Common/.github/workflows/build-android-app.yml@969a35961fdda773dbecd6a09fa1830a0459c34c
    with:
      app: gridcraft
      common_ref: 969a35961fdda773dbecd6a09fa1830a0459c34c
      build_mode: ${{ inputs.build_mode || 'release' }}
      source_version: ${{ inputs.source_version || 'stable' }}
    secrets: inherit
