name: GridCraft Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/prepare-gridcraft-android.py'
      - 'HEBREW_STATUS.md'
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build a test APK or a distributable signed Release
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
      source_version:
        description: Kept for traceability; GridCraft uses the pinned Hebrew source commit
        required: true
        type: choice
        default: stable
        options:
          - stable
          - main

permissions:
  contents: write

jobs:
  build:
    uses: a0534186049-byte/ArtCraft-Android-Common/.github/workflows/build-android-app.yml@c128f4e8ea7e9cb49179c646d63a9240ee69b236
    with:
      app: gridcraft
      common_ref: c128f4e8ea7e9cb49179c646d63a9240ee69b236
      build_mode: ${{ inputs.build_mode || 'debug' }}
      source_version: ${{ inputs.source_version || 'stable' }}
    secrets: inherit
